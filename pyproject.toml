[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nessai"
authors = [
    {name = "Michael J. Williams", email = "michaeljw1@googlemail.com"},
]
description = "Nessai: Nested Sampling with Artificial Intelligence"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = [
    "nested sampling",
    "normalizing flows",
    "machine learning",
]
dependencies = [
    "glasflow",
    "h5py>=3.0",
    "matplotlib>=2.0",
    "numpy>=1.9",
    "pandas",
    "scipy>0.16",
    "seaborn",
    "torch>=1.11.0",
    "importlib-metadata; python_version < '3.10'",
]
dynamic = [
    "version",
]

[project.urls]
"Homepage" = "https://github.com/mj-will/nessai"
"Documentation" = "https://nessai.readthedocs.io/"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-rerunfailures",
    "pytest-integration",
]
gw = [
    "lalsuite; sys_platform != 'win32'",
    "bilby",
    "astropy",
]
clustering = [
    "faiss-cpu>=1.7.3",
]
dev = [
    "pre-commit",
    "ray[default]",
    "multiprocess",
    "corner",
    "ruff",
    "faiss-cpu",
]
docs = [
    "sphinx",
    "sphinx-book-theme",
    "sphinx_tabs",
    "nessai-models",
    "ipython",
    "numpydoc",
    "sphinx-autoapi",
]
nflows = [
    "nflows",
]

[tool.setuptools_scm]
version_scheme = "release-branch-semver"

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--cov=nessai",
    "--import-mode=importlib",
]
testpaths = [
    "tests"
]

[tool.coverage.run]
source = [
    "nessai"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
extend-select = ["I"]

# Pixi reuses the package requirements and optional extras above.
[tool.pixi.workspace]
channels = ["conda-forge"]
requires-pixi = ">=0.78"
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
nessai = { path = ".", editable = true }

[tool.pixi.dependencies]
pytorch-cpu = "*"
matplotlib = "*"

[tool.pixi.activation.env]
MPLBACKEND = "agg"

[tool.pixi.environments]
default = ["py311", "test", "dev", "gw"]
py39 = ["py39", "test", "test-extras", "gw"]
py310 = ["py310", "test", "test-extras", "gw"]
py311 = ["py311", "test", "test-extras", "gw"]
py312 = ["py312", "test", "test-extras", "gw"]
py313 = ["py313", "test", "test-extras", "gw"]
bilby = ["py311", "test", "bilby-compatibility"]
docs = ["py311", "docs"]

[tool.pixi.feature.py39.dependencies]
python = "3.9.*"

[tool.pixi.feature.py310.dependencies]
python = "3.10.*"

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py312.dependencies]
python = "3.12.*"

[tool.pixi.feature.py313.dependencies]
python = "3.13.*"

[tool.pixi.feature.test-extras.pypi-dependencies]
corner = "*"
multiprocess = "*"
ray = { version = "*", extras = ["default"] }

[tool.pixi.feature.test.tasks]
test = "python -m pytest --without-integration --without-slow-integration"
test-integration = "python -m pytest -v -m integration_test"
test-slow-integration = "python -m pytest -v -m slow_integration_test"

[tool.pixi.feature.dev.pypi-dependencies]
# Match the formatter used by pre-commit and CI.
ruff = "==0.9.*"

[tool.pixi.feature.dev.tasks]
lint = "ruff check ."
format-check = "ruff format --check ."

[tool.pixi.feature.bilby-compatibility.pypi-dependencies]
bilby = "*"
nessai-bilby = "*"

[tool.pixi.feature.bilby-compatibility.tasks]
test-bilby = "python -m pytest --bilby-compatibility -m bilby_compatibility"

[tool.pixi.feature.docs.tasks]
docs = { cmd = "sphinx-build -b html . _build/html", cwd = "docs" }
